name: tinetv
description: "TİNE TV - Live, VOD & Music"
publish_to: 'none'
version: 2.1.0+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_remote_config: ^6.5.2
  firebase_analytics: ^12.4.2
  google_mobile_ads: ^6.0.0
  get: ^4.7.3
  dio: ^5.9.2
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  connectivity_plus: 6.1.1
  better_player_plus: ^1.0.8
  unity_ads_plugin: ^0.3.30
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/splash.png
  color_dark: "#0A0A0A"
  image_dark: assets/splash.png
  android: true
  ios: true
  fullscreen: true
