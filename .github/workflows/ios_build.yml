name: iOS Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Flutter kurulum
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Sertifika ve Profile kurulum
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          # P12 kur
          echo "$CERTIFICATES_P12" | base64 --decode > cert.p12
          
          # Keychain oluştur
          security create-keychain -p "build123" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "build123" build.keychain
          
          # Sertifikayı yükle
          security import cert.p12 -k build.keychain -P "$CERTIFICATES_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain login.keychain
          
          # Partition list
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build123" build.keychain
          
          # Sertifika kontrol
          security find-identity -v -p codesigning build.keychain
          
          # Provisioning Profile kur
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/TineTV.mobileprovision
          
          # Profile kontrol
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Flutter analyze
        run: flutter analyze

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: IPA yükle
        uses: actions/upload-artifact@v4
        with:
          name: TineTV-iOS
          path: build/ios/ipa/*.ipa

      - name: TestFlight'a gönder
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey $APPSTORE_KEY_ID \
            --apiIssuer $APPSTORE_ISSUER_ID \
            --private-key ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8